name: MVP checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  node-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python service compile
        run: npm run check:python-service

      - name: Python service tests
        run: npm run check:python-service:test
